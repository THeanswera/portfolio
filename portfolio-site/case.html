    <title>Кейсы — Александра Мельникова</title>
    <meta
      name="description"
      content="Разборы проектов: задача, решения, экраны и стек. Список работ портфолио."
    />
    <meta name="theme-color" content="#F4F1EA" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!--
      Старый адрес кейсов. На хостинге .htaccess перенаправляет:
        /case.html?work=<id>  →  /cases/<slug>/   (301)
        /case.html            →  /cases/          (301)
      Эта страница нужна как запасной путь — если файл откроют напрямую или
      из локальной сборки. В поиске ей делать нечего: содержимое то же самое.
    -->
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <div id="case-root"></div>
    <script type="module" src="/src/case.tsx"></script>
  </body>
</html>
