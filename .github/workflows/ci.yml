name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portfolio:
    name: Портфолио
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы и сборка
        run: npm run build

      - name: Метаданные, карта сайта и ссылки в собранном сайте
        run: node scripts/check-seo.mjs dist

      - name: Проверка в браузере на 360, 768 и 1440
        run: node scripts/check-responsive.mjs

      - name: Доступность, клавиатура и ширины 320–1440
        run: node scripts/audit-a11y.mjs

      - name: Визуальная проверка страниц
        run: node scripts/audit-visual.mjs

      - name: Наложение текста и выход за сетку
        run: node scripts/check-layout.mjs --site portfolio

      - name: Кодировка и ссылки
        run: |
          node scripts/check-mojibake.mjs dist html,css,js
          node scripts/check-links.mjs dist

      - name: Отчёт проверки
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-report
          path: |
            .tmp-check/report.json
            .tmp-check/*.png
            .tmp-audit/audit.json
            .tmp-audit/*.png
            .tmp-a11y/a11y.json
          if-no-files-found: ignore
          retention-days: 7

  masterskaya:
    name: Демо-сайт мастерской
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterskaya-forma

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Сборка
        run: node build.mjs

      - name: Проверка в браузере на 360, 768 и 1440
        run: node scripts/check.mjs

      - name: Зависимости для проверки пометок о демо
        working-directory: portfolio-site
        run: npm ci

      - name: Пометки о демонстрационном проекте на демо-сайтах
        working-directory: portfolio-site
        run: node scripts/check-demo-notices.mjs

      - name: Наложение текста и выход за сетку на демо-страницах
        working-directory: portfolio-site
        run: node scripts/check-layout.mjs --site remont,forma

  kitstroy:
    name: Тема «КИТ-Строй.Москва»
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitstroy-moscow

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Сборка стилей и скриптов
        run: node build.mjs

      - name: Проверка кодировки исходников
        run: node ../portfolio-site/scripts/check-mojibake.mjs . php,scss,css,js,mjs,md

      - name: Проверка, что dist не разошёлся с исходниками
        run: |
          git diff --exit-code -- assets/dist || {
            echo "assets/dist отличается от собранного: запустите node build.mjs и закоммитьте."
            exit 1
          }

  sertexity:
    name: Sertexity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sertexity

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Сборка
        run: node build.mjs

      - name: Проверка в браузере на 360, 768 и 1440
        run: node scripts/check.mjs

  sextant:
    name: СЕКСТАНТ
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sextant

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Сборка
        run: node build.mjs

      - name: Проверка кодировки исходников
        run: node ../portfolio-site/scripts/check-mojibake.mjs . mjs,js,css,php,json

      - name: Проверка страниц, 3D-сцен и конфигуратора в браузере
        run: node scripts/check.mjs
