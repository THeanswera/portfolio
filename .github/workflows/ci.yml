name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portfolio:
    name: Портфолио
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы и сборка
        run: npm run build

      - name: Проверка в браузере на 360, 768 и 1440
        run: node scripts/check-responsive.mjs

      - name: Визуальная проверка страниц
        run: node scripts/audit-visual.mjs

      - name: Кодировка и ссылки
        run: |
          node scripts/check-mojibake.mjs dist html,css,js
          node scripts/check-links.mjs dist

      - name: Отчёт проверки
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-report
          path: |
            .tmp-check/report.json
            .tmp-check/*.png
            .tmp-audit/audit.json
            .tmp-audit/*.png
          if-no-files-found: ignore
          retention-days: 7

  masterskaya:
    name: Демо-сайт мастерской
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterskaya-forma

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Сборка
        run: node build.mjs

      - name: Проверка в браузере на 360, 768 и 1440
        run: node scripts/check.mjs
