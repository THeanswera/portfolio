name: Публикация

# Запускается вручную: публикация на живой сайт — осознанное действие,
# а не побочный эффект каждого коммита.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Что публикуем
        required: true
        default: both
        type: choice
        options:
          - both
          - portfolio
          - masterskaya
          - kitstroy
          - sertexity

jobs:
  deploy:
    name: Сборка и выгрузка
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Проверка доступа к хостингу
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Не заданы секреты FTP_USER и FTP_PASS — публикация невозможна."
            exit 1
          fi

      - name: Сборка портфолио
        if: inputs.target != 'masterskaya' && inputs.target != 'kitstroy' && inputs.target != 'sertexity'
        working-directory: portfolio-site
        run: |
          npm ci
          npm run build

      - name: Сборка демо-сайта
        if: inputs.target != 'portfolio' && inputs.target != 'kitstroy' && inputs.target != 'sertexity'
        working-directory: masterskaya-forma
        run: node build.mjs

      - name: Сборка Sertexity
        if: inputs.target == 'sertexity'
        working-directory: sertexity
        run: node build.mjs

      - name: Сборка темы «КИТ-Строй.Москва»
        if: inputs.target == 'kitstroy'
        working-directory: kitstroy-moscow
        run: node build.mjs

      - name: Выгрузка портфолио
        if: inputs.target != 'masterskaya' && inputs.target != 'kitstroy' && inputs.target != 'sertexity'
        working-directory: portfolio-site
        env:
          FTP_DIR: /www/rootlost.online
        run: node scripts/deploy.mjs

      - name: Выгрузка демо-сайта
        if: inputs.target != 'portfolio' && inputs.target != 'kitstroy' && inputs.target != 'sertexity'
        env:
          FTP_SRC: masterskaya-forma/dist
          FTP_DIR: /www/masterskaya-forma.ru
        run: node portfolio-site/scripts/deploy.mjs

      - name: Выгрузка Sertexity
        if: inputs.target == 'sertexity'
        env:
          FTP_SRC: sertexity/dist
          FTP_DIR: /www/masterskaya-forma.online
        run: node portfolio-site/scripts/deploy.mjs

      - name: Выгрузка темы «КИТ-Строй.Москва»
        if: inputs.target == 'kitstroy'
        env:
          FTP_SRC: kitstroy-moscow
          FTP_DIR: /www/rootlost.ru/wp-content/themes/kitstroy-moscow
        run: node portfolio-site/scripts/deploy.mjs

      - name: Проверка живых сайтов
        run: |
          curl -s -o /dev/null -w "rootlost.online → %{http_code}\n" --max-time 30 https://rootlost.online/
          curl -s -o /dev/null -w "masterskaya-forma.ru → %{http_code}\n" --max-time 30 https://masterskaya-forma.ru/
          if [ "${{ inputs.target }}" = "kitstroy" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://rootlost.ru/)
            echo "rootlost.ru → $code"
            if [ "$code" != "200" ]; then
              echo "Тема не отвечает: проверьте вывод PHP на хостинге."
              exit 1
            fi
          fi
          if [ "${{ inputs.target }}" = "sertexity" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://masterskaya-forma.online/)
            echo "masterskaya-forma.online → $code"
            if [ "$code" != "200" ]; then
              echo "Sertexity не отвечает: проверьте выгрузку."
              exit 1
            fi
          fi
